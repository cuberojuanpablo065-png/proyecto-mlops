# =====================================================================
# docker-compose.yml - levanta todos los servicios con "docker compose up"
# Lee las variables de un archivo .env (no versionado). Ver .env.example.
# =====================================================================

services:
  # --- Servicio de la API del modelo ---
  model-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${REGISTRO:-local}/model-service:${VERSION:-0.2.0}
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Si no se usa bucket, el modelo se toma del volumen montado.
      MODEL_PATH: models/model.joblib
      DB_PATH: data/predicciones.db
    volumes:
      - ./models:/app/models:ro      # modelo serializado (en local)
      - ./data:/app/data             # base de datos de predicciones
    restart: unless-stopped

  # --- Servicio LLM (explica las predicciones) ---
  llm-service:
    build:
      context: .
      dockerfile: Dockerfile.llm
    image: ${REGISTRO:-local}/llm-service:${VERSION:-0.2.0}
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      MODEL_SERVICE_URL: http://model-service:8000
    depends_on:
      - model-service
    restart: unless-stopped

