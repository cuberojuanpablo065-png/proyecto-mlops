# =====================================================================
# docker-compose.redundancia.yml - Dos réplicas del servicio del modelo
# detrás de Nginx (E.4). Para la prueba de redundancia:
#   docker compose -f docker-compose.redundancia.yml up -d --build
#   # durante la prueba de carga, detener una réplica:
#   docker compose -f docker-compose.redundancia.yml stop model-b
#   # el servicio sigue respondiendo por Nginx (http://localhost:8080)
# =====================================================================

services:
  model-a:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      MODEL_PATH: models/model.joblib
      DB_PATH: /tmp/a.db
    volumes:
      - ./models:/app/models:ro

  model-b:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      MODEL_PATH: models/model.joblib
      DB_PATH: /tmp/b.db
    volumes:
      - ./models:/app/models:ro

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - model-a
      - model-b
