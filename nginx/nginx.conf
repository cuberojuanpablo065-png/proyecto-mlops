# Nginx como balanceador entre dos réplicas del servicio del modelo (E.4).
# Si una réplica se cae, Nginx enruta a la otra (redundancia).
events {}

http {
    upstream model_backend {
        server model-a:8000 max_fails=1 fail_timeout=5s;
        server model-b:8000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://model_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Si una réplica falla, intentar con la siguiente.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;
        }
    }
}
