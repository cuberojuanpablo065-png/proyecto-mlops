# Blueprint de despliegue en Render.com (capa gratuita).
# Dos servicios Docker. El modelo se descarga de MODEL_URL al iniciar.
services:
  - type: web
    name: model-service
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_URL
        sync: false
      - key: DB_PATH
        value: /tmp/predicciones.db

  - type: web
    name: llm-service
    runtime: docker
    dockerfilePath: ./Dockerfile.llm
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_SERVICE_URL
        sync: false
      - key: LLM_MOCK
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
