# Blueprint de despliegue en Render.com (capa gratuita).
services:
  - type: web
    name: model-service
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_URL
        sync: false
      - key: MODEL_PATH
        value: /tmp/model.joblib
      - key: DB_PATH
        value: /tmp/predicciones.db

  - type: web
    name: llm-service
    runtime: docker
    dockerfilePath: ./Dockerfile.llm
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_SERVICE_URL
        sync: false
      - key: LLM_MOCK
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
