# =====================================================================
# render.yaml - Blueprint de despliegue en Render.com (capa gratuita)
# ---------------------------------------------------------------------
# Define los dos servicios como contenedores Docker. Render construye
# cada imagen desde su Dockerfile y expone una URL pública (HTTPS).
#
# El modelo NO va en la imagen: el model-service lo descarga al iniciar
# desde MODEL_URL (un asset de GitHub Release). Las variables sensibles
# (OPENAI_API_KEY) se configuran en el panel de Render, no aquí.
# =====================================================================
services:
  # --- API del modelo ---
  - type: web
    name: model-service
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_URL
        sync: false          # se completa en el panel (URL del release)
      - key: DB_PATH
        value: /tmp/predicciones.db

  # --- Servicio LLM ---
  - type: web
    name: llm-service
    runtime: docker
    dockerfilePath: ./Dockerfile.llm
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_SERVICE_URL
        fromService:
          name: model-service
          type: web
          property: hostport   # host:puerto interno del otro servicio
      - key: LLM_MOCK
        value: "true"          # cambia a false y agrega OPENAI_API_KEY para el LLM real
      - key: OPENAI_API_KEY
        sync: false
