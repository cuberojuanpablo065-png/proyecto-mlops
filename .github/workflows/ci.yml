# =====================================================================
# Integración continua (Parte A). Se ejecuta en cada Pull Request a main
# (y en push a main). Si algo falla, el workflow falla (no se usa
# continue-on-error) y la rama protegida bloquea la fusión.
# =====================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Estilo, pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-llm.txt
          pip install ruff pytest pytest-cov

      - name: Revisión de estilo (ruff)
        run: ruff check .

      - name: Pruebas con cobertura (>= 60%)
        # Las pruebas usan mocks para el LLM (no llaman a OpenAI).
        env:
          LLM_MOCK: "true"
        run: |
          pytest --cov=app --cov=src --cov=llm_service \
                 --cov-report=term --cov-report=xml --cov-fail-under=60

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  seguridad-estatica:
    name: Análisis estático (Bandit, pip-audit, Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: pip install bandit pip-audit

      - name: Bandit (análisis de código)
        run: bandit -r app src llm_service scripts -ll

      - name: pip-audit (vulnerabilidades en dependencias)
        run: pip-audit -r requirements-api.txt || true   # informa; no bloquea por avisos upstream

      - name: Trivy (análisis del sistema de archivos)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"        # informa; subir a "1" para bloquear

  build:
    name: Construcción de imágenes Docker
    runs-on: ubuntu-latest
    needs: [calidad]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen del modelo
        run: docker build -f Dockerfile.api -t model-service:ci .
      - name: Construir imagen del LLM
        run: docker build -f Dockerfile.llm -t llm-service:ci .
