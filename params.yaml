# =====================================================================
# params.yaml - Parámetros del pipeline y espacios de búsqueda
# ---------------------------------------------------------------------
# DVC rastrea este archivo: cambiarlo invalida las etapas que dependen
# de él y "dvc repro" vuelve a ejecutarlas. Mantener aquí TODO lo que
# controla el comportamiento del pipeline facilita la reproducibilidad.
# =====================================================================

semilla: 42                         # semilla global para reproducibilidad

datos:
  # Fuente: CrimeBase (NCRB India) en Kaggle. El usuario coloca
  # crime_state_year.csv en data/external/ (ver README). La ingesta
  # construye el panel modelable (rezagos + objetivo) en archivo_crudo.
  fuente_externa: "data/external/crime_state_year.csv"
  archivo_crudo: "data/raw/crime_panel.csv"
  metrica_fuente: cases_registered  # solo filas de casos registrados
  # Para el versionamiento de datos (B.2.3) y el drift (Entregable 3):
  # la versión 1 usa años <= anio_corte_v1; la v2 (--simular-v2) usa todos.
  anio_corte_v1: 2022

split:
  # Feedback E1: la división debe ser POR TIEMPO (no aleatoria), porque el
  # problema predice el próximo año. Se entrena con años <= anio_corte_test
  # y se prueba con años > anio_corte_test (datos más recientes, no vistos).
  tipo: temporal                    # temporal | aleatorio
  anio_corte_test: 2020             # train: años <= 2020 ; test: años 2021-2022
  test_size: 0.2                    # solo se usa si tipo = aleatorio
  estratificar: true                # solo se usa si tipo = aleatorio

cv:
  n_folds: 3                        # validación cruzada para optimización (NO toca el test)

# --- Espacio de búsqueda de hiperparámetros (A.5) ---------------------
optimizacion:
  modelo_a_optimizar: random_forest
  metodo: randomized_search        # randomized_search | grid_search
  n_iter: 6                       # combinaciones a probar
  espacio_busqueda:
    clf__n_estimators: [100, 150, 200]
    clf__max_depth: [null, 10, 16, 24, 32]
    clf__min_samples_split: [2, 5, 10, 20]
    clf__min_samples_leaf: [1, 2, 4]
    clf__max_features: ["sqrt", "log2", 0.5]
    clf__class_weight: ["balanced", "balanced_subsample"]

# --- Modelos base a comparar (A.4) ------------------------------------
modelos:
  regresion_logistica:
    C: 1.0
    max_iter: 1000
    class_weight: balanced
  random_forest:
    n_estimators: 200
    class_weight: balanced
    n_jobs: 1                       # n_jobs=1 => resultados deterministas (reproducibilidad)
